# Sentin8 local development environment - Docker Compose.
# Stories 0.1.2: Docker Compose for local dev (PostgreSQL, Valkey).
# Story 0.1.3: Sentin8:Sentin8:TLS is the reverse proxy with wildcard *.local.sentin8.dev Sentin8:TLS.
#
# Only infrastructure containers are defined here (PostgreSQL, Valkey). Sentin8
# Rust services run directly on the host via `make run-<service>` during
# development. Sentin8:Sentin8:TLS (Rust) terminates Sentin8:TLS and routes to backend services on
# localhost. Production deployments use a full compose or Kubernetes.
#
# Both data planes run certificate identity (group DESIGN.md §3.1, §3.2):
# `make infra-tls` mints the server leaves + control/ops pairs and seeds
# pg_hba.conf/pg_ident.conf into ../.run/secrets/infra-tls/ BEFORE
# `make infra-up`.
#
# Usage:
#   make infra-up      # start PostgreSQL + Valkey (TLS-only)
#   make infra-down    # stop

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  # Certificate identity (group DESIGN.md §3.2): TLS-only, hostssl+cert -
  # the client certificate authenticates every TCP connection; there are
  # no database passwords. Role↔identity bindings are registration-driven
  # (pg_ident.conf rows appended by `sentin8-cli vertical enroll`).
  postgres:
    # pgvector image (AI design §6 - hybrid retrieval; the plain postgres
    # image cannot provide the `vector` type sentin8-ai's schema needs).
    # The TRIXIE base (Debian 13) carries OpenSSL 3.5.x - ML-DSA/SLH-DSA
    # certificate verification and X25519MLKEM768 key exchange (the PQ
    # data-plane posture, PQCA-2; the bookworm-based pg18 tag ships
    # OpenSSL 3.0 which cannot parse PQ signatures at all).
    image: pgvector/pgvector:pg18-trixie
    container_name: sentin8-postgres
    # The Sentin8 fleet runs ~20 microservices against this one PostgreSQL
    # instance. Each service caps its pool at 3 connections (see
    # `sentin8_config::pg_pool`) plus a 3-connection `sentin8-tls` sync pool, so
    # the steady-state sits comfortably under the limit. The FULL fleet
    # (60 instances: 18 platform + 42 vertical service types, six
    # vertical groups) can transiently hold ~6 connections per instance
    # at boot, so the ceiling is sized for the whole-tree boot (observed
    # 2026-10-17: 195/200 during a full fresh boot caused pool-timeout
    # crash loops on the late spawners). superuser_reserved_connections
    # guarantees operators can always run
    # diagnostics (psql) even if the fleet saturates the pool.
    #
    # ── PostgreSQL certificate identity (group DESIGN.md §3.2) ─────────
    # TLS-ONLY: ssl=on with the Acme-issued server leaf, hostssl+cert
    # rules in pg_hba.conf (no plaintext listener, no passwords - the
    # client certificate decides the connecting role through the pgm
    # identity map; `make infra-tls` writes the seed files, `sentin8-cli
    # vertical enroll` appends the per-workload rows).
    command: >
      postgres
      -c max_connections=600
      -c superuser_reserved_connections=5
      -c ssl=on
      -c ssl_cert_file=/tls/postgres-server.crt
      -c ssl_key_file=/tls/postgres-server.key
      -c ssl_ca_file=/tls-ca/root-ca.crt
      -c hba_file=/pg-config/pg_hba.conf
      -c ident_file=/pg-config/pg_ident.conf
    # Runs as the HOST user (like the valkey service) so the 0600
    # infra-tls material minted by `make infra-tls` is readable: postgres
    # refuses a private key file with group/world bits. The pgdata volume
    # must be owned by the same UID (dev data is disposable - recreate
    # with `docker compose down -v` after changing this).
    user: "1000:1000"
    environment:
      POSTGRES_USER: sentin8
      # Certificate identity (§3.2): the password field is never checked -
      # every TCP connection presents a client certificate (hostssl+cert).
      # POSTGRES_PASSWORD remains only because the image's initdb entrypoint
      # requires one to bootstrap the data directory; the HBA has no SCRAM
      # line for external hosts, so it can never be used over the network.
      POSTGRES_PASSWORD: sentin8
      POSTGRES_DB: sentin8
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--auth-host=cert"
    ports:
      - "5432:5432"
    volumes:
      - sentin8-pgdata:/var/lib/postgresql/data/pgdata
      # The infra-tls material: server leaf + operator pair (0600, host
      # UID - the container runs as the same user) + the public CA chain
      # (client-cert verification needs ssl_ca_file pointing at the
      # Acme root+intermediate) + the seeded HBA/ident config files.
      # DIRECTORIES, never single files: a single-file bind mount pins
      # the inode, so the enroll pass's rewrite (new inode) would be
      # invisible to the container - Postgres would keep reading the
      # stale bootstrap-time map. Directory mounts propagate rewrites.
      - ../.run/secrets/infra-tls:/tls:ro
      - ../.run/secrets/acme-ca:/tls-ca:ro
      - ../.run/secrets/infra-tls:/pg-config:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentin8 -d sentin8"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Valkey ─────────────────────────────────────────────────────────────
  # Certificate identity (group DESIGN.md §3.1): the data plane runs
  # TLS-ONLY - `--port 0` disables the plaintext listener, `--tls-port`
  # serves with `tls-auth-clients yes` (no client cert, no connection).
  # Valkey 9 maps the client cert's CN to the ACL user of the same name
  # (`tls-auth-clients-user CN`); `vertical enroll` provisions per-workload
  # users. NO Valkey secrets anywhere. The server leaf + local control
  # pair live in ../.run/secrets/infra-tls, the public Root CA in
  # ../.run/secrets/acme-ca (both materialized by `make infra-tls` -
  # `sentin8-acme --ensure-infra-tls`, which must run before this
  # container starts). AOF persistence as before; used by Sentin8:Bus
  # (streams), Sentin8:BFF (sessions), Sentin8:Auth (protocol state),
  # Sentin8:Captain (registry).
  valkey:
    image: valkey/valkey:9-alpine
    container_name: sentin8-valkey
    # Run as the HOST user so the 0600 TLS material (owner-only, minted by
    # the operator's `make infra-tls`) is readable - the image's own
    # `valkey` user has a different uid and would be locked out. Dev infra
    # runs single-user; the data volume is also owned by this uid.
    user: "1000:1000"
    command: >
      valkey-server
      --port 0
      --tls-port 6379
      --tls-cert-file /tls/valkey-server.crt
      --tls-key-file /tls/valkey-server.key
      --tls-ca-cert-file /tls-ca/root-ca.crt
      --tls-auth-clients yes
      --tls-auth-clients-user CN
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - sentin8-valkeydata:/data
      - ../.run/secrets/infra-tls:/tls:ro
      - ../.run/secrets/acme-ca:/tls-ca:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --tls --cert /tls/valkey-control.crt --key /tls/valkey-control.key --cacert /tls-ca/root-ca.crt ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── pgAdmin 4 (operator database console) ─────────────────────────────
  # A web UI in front of the SAME PostgreSQL instance - a convenience
  # plane, never a data plane. It reads through the `m2m-postgres-ops`
  # client identity, which the pg_ident map already binds to the `sentin8`
  # DDL/operator role, so no new role, password, or HBA line is introduced.
  #
  # WHY A CLIENT CERTIFICATE IS THE ONLY WAY IN: pg_hba.conf has NO
  # `host`/`md5`/`scram` line for external hosts - every TCP connection is
  # `hostssl ... cert map=pgm clientcert=verify-full`. pgAdmin therefore
  # cannot log in with a password at all; it must present
  # `postgres-ops.crt`/`.key` and trust the platform CA. Both are mounted
  # read-only from the SAME infra-tls material the host CLI uses, so the
  # console is exactly as privileged as `sentin8-cli` running on the host -
  # no more.
  #
  # TRANSPORT: pgAdmin talks to postgres over the compose network by
  # SERVICE NAME (`postgres`), which is what the server leaf's SAN list
  # must carry for `verify-full` to pass. `make infra-up` therefore calls
  # `make infra-tls INFRA_SANS=postgres,valkey`; the SAN-coverage contract
  # (`leaf_covers_sans`) re-mints an existing leaf that lacks them, so a
  # tree booted before this service existed converges on the next
  # `make infra-up` without a manual `down -v`.
  #
  # BOUND TO LOOPBACK: the console exposes a full SQL console over the
  # whole platform database, so it is published on 127.0.0.1 only - it is
  # never reachable from the network, and it is not routed through the
  # ingress (no hostname, no CA leaf, no DNS name).
  #
  # Disable with `PGADMIN_DISABLE=1` or `docker compose up -d postgres
  # valkey` (the explicit form `make infra-up` used before this existed).
  pgadmin:
    # Pinned minor-free major tag: pgAdmin 9 is the release that dropped
    # Python 3.8 and ships a current Werkzeug - `latest` would drift.
    image: dpage/pgadmin4:9
    container_name: sentin8-pgadmin
    profiles: ["pgadmin"]
    # ── CONSOLE SIGN-IN: platform SSO, not a static password ──────────
    # pgAdmin's default is `AUTHENTICATION_SOURCES = ['internal']`, i.e. a
    # static login baked into env. The platform does not work that way -
    # operators are Sentin8:Auth users, and their identity comes from an
    # OIDC authorization-code round trip.
    #
    # There is NO static console password and NO hardcoded domain here.
    # Both come from `infra/pgadmin/pgadmin-oidc-login.sh`, which reads
    # SENTIN8_DOMAIN from the tree-root `.env`, performs Dynamic Client
    # Registration (RFC 7591) against that fleet's auth, and writes
    # `/etc/pgadmin/config_system.py` - the LAST layer pgAdmin loads
    # (evaluate_config.py loads config_distro, then config_local, then
    # config_system), so it wins over anything the image ships.
    #
    # pgAdmin's users are auto-created from the OIDC `email` claim on
    # first sign-in (OAUTH2_AUTO_CREATE_USER + the username claim), so no
    # local account has to pre-exist.
    environment:
      # SERVER_MODE must be TRUE for SSO to exist at all: pgAdmin only
      # registers the oauth2 auth module inside `if config.SERVER_MODE`
      # (pgadmin/authenticate/registry.py load_modules) - in desktop mode
      # it silently loads `internal` only, the OAuth2 routes 404, and the
      # static password is the only way in. That is the exact opposite of
      # what this console needs.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # No telemetry, no update checks: this box is often offline.
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_GRAVATAR_URL: "''"
      # Users arrive through OIDC; let pgAdmin create them on first login.
      PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: "True"
      # The console is loopback-only and the DATABASE credential is a
      # certificate, so a second master-password prompt adds nothing.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # pgAdmin's OIDC client validates the auth server with requests +
      # certifi, which knows nothing of the platform CA - the discovery
      # fetch would fail with "self-signed certificate in certificate
      # chain" and the SSO button would 500. `make infra-pgadmin` writes a
      # bundle (certifi + this fleet's root & intermediate) and these two
      # point both requests and OpenSSL at it.
      REQUESTS_CA_BUNDLE: /ca-bundle/ca-bundle.pem
      SSL_CERT_FILE: /ca-bundle/ca-bundle.pem
    # ── ROUTE THE AUTH HOST OUT OF THE CONTAINER ──────────────────────
    # The SSO round trip straddles two resolution worlds. The BROWSER (on
    # the host) follows the dev wildcard `*.local.sentin8.dev -> 127.0.0.1`
    # and reaches the ingress correctly. The CONTAINER gets the same
    # 127.0.0.1 answer, which is its OWN loopback - so the server-side half
    # of the exchange (token, userinfo, discovery) is refused.
    #
    # This entry points the auth host at the docker host gateway, where the
    # ingress listens on :443. It is rendered from the SAME SENTIN8_DOMAIN
    # the DCR script used, in REQUIRED form: a compose run without the
    # domain fails loudly instead of emitting a hostless entry that fails
    # at sign-in (DESIGN §3.2.5).
    extra_hosts:
      - "auth.ops.sys.${SENTIN8_DOMAIN:?SENTIN8_DOMAIN must be set - pass --env-file ../.env}:host-gateway"
    ports:
      # Loopback-only by construction (see the note above).
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - sentin8-pgadmin:/var/lib/pgadmin
      # The m2m-postgres-ops pair (the operator identity the pg_ident map
      # binds to role `sentin8`) + the public CA chain it must trust.
      # DIRECTORY mounts, matching the postgres service: the infra-tls
      # rewrite replaces inodes, and a single-file bind would pin the old
      # one.
      - ../.run/secrets/infra-tls:/certs:ro
      - ../.run/secrets/acme-ca:/ca:ro
      # The generated SSO config (AUTHENTICATION_SOURCES + OAUTH2_CONFIG
      # built from this tree's domain and the DCR result) and the CA
      # bundle its OIDC client trusts. Written by `make infra-pgadmin`; the
      # directory is gitignored runtime state.
      - ../.run/pgadmin:/etc/pgadmin:ro
      - ../.run/pgadmin:/ca-bundle:ro
      # Pre-registers the fleet server (certificate + verify-full) so the
      # console opens on the database instead of an empty server list.
      # pgAdmin reads this ONLY on first boot (when the pgadmin volume is
      # empty); editing it later needs `docker compose rm -f pgadmin` plus
      # a volume wipe. `make infra-reset-pgadmin` does both.
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /misc/ping is unauthenticated and returns 200 once gunicorn is up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  sentin8-pgdata:
  sentin8-valkeydata:
  sentin8-pgadmin: