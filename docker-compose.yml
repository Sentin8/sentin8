# Sentin8 local development environment - Docker Compose.
# Stories 0.1.2: Docker Compose for local dev (PostgreSQL, Valkey).
# Story 0.1.3: Sentin8:Sentin8:TLS is the reverse proxy with wildcard *.sentin8.local Sentin8:TLS.
#
# Only infrastructure containers are defined here (PostgreSQL, Valkey). Sentin8
# Rust services run directly on the host via `make run-<service>` during
# development. Sentin8:Sentin8:TLS (Rust) terminates Sentin8:TLS and routes to backend services on
# localhost. Production deployments use a full compose or Kubernetes.
#
# Both data planes run certificate identity (group DESIGN.md §3.1, §3.2):
# `make infra-tls` mints the server leaves + control/ops pairs and seeds
# pg_hba.conf/pg_ident.conf into ../.run/secrets/infra-tls/ BEFORE
# `make infra-up`.
#
# Usage:
#   make infra-up      # start PostgreSQL + Valkey (TLS-only)
#   make infra-down    # stop

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  # Certificate identity (group DESIGN.md §3.2): TLS-only, hostssl+cert -
  # the client certificate authenticates every TCP connection; there are
  # no database passwords. Role↔identity bindings are registration-driven
  # (pg_ident.conf rows appended by `sentin8-cli vertical enroll`).
  postgres:
    # pgvector image (AI design §6 - hybrid retrieval; the plain postgres
    # image cannot provide the `vector` type sentin8-ai's schema needs).
    image: pgvector/pgvector:pg18
    container_name: sentin8-postgres
    # The Sentin8 fleet runs ~20 microservices against this one PostgreSQL
    # instance. Each service caps its pool at 3 connections (see
    # `sentin8_config::pg_pool`) plus a 3-connection `sentin8-tls` sync pool, so
    # the steady-state sits comfortably under the limit. The FULL fleet
    # (60 instances: 18 platform + 42 vertical service types, six
    # vertical groups) can transiently hold ~6 connections per instance
    # at boot, so the ceiling is sized for the whole-tree boot (observed
    # 2026-10-17: 195/200 during a full fresh boot caused pool-timeout
    # crash loops on the late spawners). superuser_reserved_connections
    # guarantees operators can always run
    # diagnostics (psql) even if the fleet saturates the pool.
    #
    # ── PostgreSQL certificate identity (group DESIGN.md §3.2) ─────────
    # TLS-ONLY: ssl=on with the Acme-issued server leaf, hostssl+cert
    # rules in pg_hba.conf (no plaintext listener, no passwords - the
    # client certificate decides the connecting role through the pgm
    # identity map; `make infra-tls` writes the seed files, `sentin8-cli
    # vertical enroll` appends the per-workload rows).
    command: >
      postgres
      -c max_connections=600
      -c superuser_reserved_connections=5
      -c ssl=on
      -c ssl_cert_file=/tls/postgres-server.crt
      -c ssl_key_file=/tls/postgres-server.key
      -c ssl_ca_file=/tls-ca/root-ca.crt
      -c hba_file=/pg-config/pg_hba.conf
      -c ident_file=/pg-config/pg_ident.conf
    # Runs as the HOST user (like the valkey service) so the 0600
    # infra-tls material minted by `make infra-tls` is readable: postgres
    # refuses a private key file with group/world bits. The pgdata volume
    # must be owned by the same UID (dev data is disposable - recreate
    # with `docker compose down -v` after changing this).
    user: "1000:1000"
    environment:
      POSTGRES_USER: sentin8
      # Certificate identity (§3.2): the password field is never checked -
      # every TCP connection presents a client certificate (hostssl+cert).
      # POSTGRES_PASSWORD remains only because the image's initdb entrypoint
      # requires one to bootstrap the data directory; the HBA has no SCRAM
      # line for external hosts, so it can never be used over the network.
      POSTGRES_PASSWORD: sentin8
      POSTGRES_DB: sentin8
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--auth-host=cert"
    ports:
      - "5432:5432"
    volumes:
      - sentin8-pgdata:/var/lib/postgresql/data/pgdata
      # The infra-tls material: server leaf + operator pair (0600, host
      # UID - the container runs as the same user) + the public CA chain
      # (client-cert verification needs ssl_ca_file pointing at the
      # Acme root+intermediate) + the seeded HBA/ident config files.
      # DIRECTORIES, never single files: a single-file bind mount pins
      # the inode, so the enroll pass's rewrite (new inode) would be
      # invisible to the container - Postgres would keep reading the
      # stale bootstrap-time map. Directory mounts propagate rewrites.
      - ../.run/secrets/infra-tls:/tls:ro
      - ../.run/secrets/acme-ca:/tls-ca:ro
      - ../.run/secrets/infra-tls:/pg-config:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentin8 -d sentin8"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Valkey ─────────────────────────────────────────────────────────────
  # Certificate identity (group DESIGN.md §3.1): the data plane runs
  # TLS-ONLY - `--port 0` disables the plaintext listener, `--tls-port`
  # serves with `tls-auth-clients yes` (no client cert, no connection).
  # Valkey 9 maps the client cert's CN to the ACL user of the same name
  # (`tls-auth-clients-user CN`); `vertical enroll` provisions per-workload
  # users. NO Valkey secrets anywhere. The server leaf + local control
  # pair live in ../.run/secrets/infra-tls, the public Root CA in
  # ../.run/secrets/acme-ca (both materialized by `make infra-tls` -
  # `sentin8-acme --ensure-infra-tls`, which must run before this
  # container starts). AOF persistence as before; used by Sentin8:Bus
  # (streams), Sentin8:BFF (sessions), Sentin8:Auth (protocol state),
  # Sentin8:Captain (registry).
  valkey:
    image: valkey/valkey:9-alpine
    container_name: sentin8-valkey
    # Run as the HOST user so the 0600 TLS material (owner-only, minted by
    # the operator's `make infra-tls`) is readable - the image's own
    # `valkey` user has a different uid and would be locked out. Dev infra
    # runs single-user; the data volume is also owned by this uid.
    user: "1000:1000"
    command: >
      valkey-server
      --port 0
      --tls-port 6379
      --tls-cert-file /tls/valkey-server.crt
      --tls-key-file /tls/valkey-server.key
      --tls-ca-cert-file /tls-ca/root-ca.crt
      --tls-auth-clients yes
      --tls-auth-clients-user CN
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - sentin8-valkeydata:/data
      - ../.run/secrets/infra-tls:/tls:ro
      - ../.run/secrets/acme-ca:/tls-ca:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --tls --cert /tls/valkey-control.crt --key /tls/valkey-control.key --cacert /tls-ca/root-ca.crt ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sentin8-pgdata:
  sentin8-valkeydata: